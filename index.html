<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bistrot Arcade</title>
<meta name="description" content="Sept jeux d'arcade pour réviser le Français B : grammaire, types de textes, registres.">
<meta name="theme-color" content="#1A1226">
<meta name="apple-mobile-web-app-title" content="Bistrot Arcade">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alfa+Slab+One&family=Jost:wght@400;500;700;800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1226; --screen:#0E0A18; --panel:#2A2140; --panel2:#3D3160;
    --cream:#F7EDD8; --rouge:#E63946; --bleu:#4D7CFF; --mint:#5EEAD4; --gold:#F4C95D; --pink:#FF6FB5;
    --green:#5CD65C; --red:#FF4B4B; --white:#FFF8EC; --muted:#B3A8C9;
    --pixel:"Rye","Alfa Slab One",Georgia,serif; --term:"Lora",Georgia,"Times New Roman",serif;
    --ink:#2B1A10; --paper:#E6D5AE; --paper2:#F4E9D2; --paper3:#EFE0BF; --edge:#C9B48C; --mustard:#C9932B; --teal:#3D8B7A; --brick:#B8302A; --leaf:#4F8A3A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--term);font-size:22px;line-height:1.2;color:var(--cream);background:var(--bg);
    background-image:radial-gradient(circle,rgba(247,237,216,.28) 1px,transparent 1.5px),radial-gradient(circle,rgba(94,234,212,.22) 1px,transparent 1.5px);
    background-size:150px 150px,95px 95px;background-position:0 0,50px 70px;overflow-x:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 140px rgba(0,0,0,.5)}
  button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0;border-radius:0}
  button:disabled{cursor:default}
  :focus-visible{outline:4px solid var(--gold);outline-offset:3px}
  .px{display:block;width:calc(var(--w)*var(--s,4)*1px);height:calc(var(--h)*var(--s,4)*1px)}
  .awning{height:16px;background:repeating-linear-gradient(90deg,var(--rouge) 0 28px,var(--cream) 28px 56px);position:relative;margin-bottom:22px}
  .awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:radial-gradient(circle at 14px 0,var(--rouge) 12px,transparent 13px) 0 0/56px 12px repeat-x,radial-gradient(circle at 14px 0,var(--cream) 12px,transparent 13px) 28px 0/56px 12px repeat-x}
  .page{max-width:1040px;margin:0 auto;padding:0 18px 60px;position:relative;z-index:1}
  .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
  .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
  .logo > span{display:flex;flex-direction:column}
  .logo-text{font-family:var(--pixel);font-size:22px;color:var(--gold);text-shadow:3px 3px 0 var(--rouge);line-height:1.2}
  .logo-sub{color:var(--muted);font-size:20px;margin:4px 0 0}
  .top-right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:var(--pixel);font-size:10px;line-height:1;background:var(--gold);color:var(--bg);padding:14px 16px 12px;box-shadow:inset -4px -4px 0 #B8912E,0 5px 0 #000;text-transform:uppercase;letter-spacing:.02em}
  .btn:hover{background:#FFDD8A}
  .btn:active{transform:translateY(5px);box-shadow:inset -4px -4px 0 #B8912E,0 0 0 #000}
  .btn.blue{background:var(--mint);box-shadow:inset -4px -4px 0 #3CA898,0 5px 0 #000}
  .btn.blue:hover{background:#8FF3E6}
  .btn.blue:active{box-shadow:inset -4px -4px 0 #3CA898,0 0 0 #000}
  .btn.rouge{background:var(--rouge);color:var(--white);box-shadow:inset -4px -4px 0 #A8262F,0 5px 0 #000}
  .btn.rouge:hover{background:#FF5C68}
  .btn.ghost{background:var(--panel);color:var(--cream);box-shadow:inset -4px -4px 0 #170f24,0 5px 0 #000}
  .btn.ghost:hover{background:var(--panel2)}
  .btn.ghost:active{box-shadow:inset -4px -4px 0 #170f24,0 0 0 #000}
  .btn.ghost.sel{background:var(--pink);color:var(--bg);box-shadow:inset -4px -4px 0 #B84A80,0 5px 0 #000}
  .btn.small{font-size:8px;padding:10px 12px 8px}
  .btn.big{font-size:14px;padding:18px 26px 16px}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .title{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:20px 0 130px}
  .title-art{display:flex;align-items:flex-end;gap:26px;margin-bottom:22px}
  .title h1{font-family:var(--pixel);font-size:clamp(26px,6.5vw,52px);color:var(--gold);text-shadow:6px 6px 0 var(--rouge),12px 12px 0 #000;margin:0 0 14px;line-height:1.2}
  .title .tsub{color:var(--mint);font-size:24px;margin:0 0 34px}
  .title .credits{position:absolute;bottom:8px;left:0;right:0;color:var(--muted);font-family:var(--pixel);font-size:8px;line-height:2}
  .marquee{position:absolute;bottom:48px;left:0;right:0;height:64px;overflow:hidden;pointer-events:none}
  .marquee-row{display:flex;gap:56px;align-items:flex-end;position:absolute;left:100%;animation:march 24s linear infinite;white-space:nowrap}
  @keyframes march{to{transform:translateX(calc(-100% - 100vw))}}
  .croissant-spin{animation:wobble 2.4s ease-in-out infinite}
  @keyframes wobble{50%{transform:rotate(12deg) translateY(-6px)}}

  h1{font-family:var(--pixel);font-size:clamp(18px,4vw,30px);color:var(--gold);text-shadow:4px 4px 0 var(--rouge);margin:0 0 8px;line-height:1.3}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .cart{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel);border:4px solid var(--panel2);padding:18px 18px 16px;box-shadow:0 6px 0 #000;transition:transform .08s ease;position:relative}
  .cart:hover,.cart:focus-visible{border-color:var(--mint);transform:translateY(-3px)}
  .cart .px{margin-bottom:14px}
  .cart-title{font-family:var(--pixel);font-size:12px;color:var(--gold);line-height:1.5;margin-bottom:8px}
  .cart-desc{color:var(--cream);font-size:21px;line-height:1.15;margin-bottom:14px;max-width:34ch}
  .cart-hi{font-family:var(--pixel);font-size:9px;color:var(--mint);margin-top:auto}
  .cart-badge{position:absolute;top:12px;right:12px;font-family:var(--pixel);font-size:8px;color:var(--pink)}

  .dialog{display:flex;gap:18px;align-items:flex-start;background:var(--panel);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2);padding:16px 18px;margin:0 0 18px;cursor:pointer}
  .dialog .px{flex:0 0 auto}
  .dbody{flex:1 1 auto;min-width:0}
  .dname{display:block;font-family:var(--pixel);font-size:9px;color:var(--pink);margin-bottom:8px}
  .dtext{margin:0;font-size:24px;line-height:1.15;min-height:56px}
  .dtext::after{content:"▮";color:var(--gold);margin-left:4px;animation:blink 1s steps(1) infinite}
  .dtext.done::after{content:"▶";color:var(--mint)}
  .dctl{display:flex;gap:10px;margin-top:12px}
  .npcbar{display:flex;gap:16px;align-items:center;background:var(--panel);border:4px solid var(--panel2);padding:12px 16px;margin:0 0 20px}
  .npcbar .px{flex:0 0 auto}
  .npctext{margin:0;font-size:23px;line-height:1.15;flex:1 1 auto}
  .npctext b{display:block;font-family:var(--pixel);font-size:9px;color:var(--pink);font-weight:400;margin-bottom:6px}

  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .game-title{font-family:var(--pixel);font-size:14px;color:var(--gold);text-shadow:3px 3px 0 var(--rouge);margin:0;flex:1 1 auto;line-height:1.5}
  .hud{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--pixel);font-size:10px;color:var(--mint)}
  .hud b{color:var(--white);font-weight:400}
  .hud .urgent b{color:var(--red)}
  .hud .diff{color:var(--pink)}
  .hearts{display:flex;gap:4px}
  .screen{background:var(--screen);border:4px solid var(--mint);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2),0 12px 0 8px #000;padding:22px;position:relative;overflow:hidden}
  .screen.shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,1px)}}
  .flash-good{animation:flashgood .4s ease}
  @keyframes flashgood{0%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--green),0 12px 0 8px #000}100%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2),0 12px 0 8px #000}}
  .lead{margin:0 0 16px;font-size:23px;max-width:62ch}
  .prompt{font-family:var(--pixel);font-size:10px;color:var(--mint);margin:16px 0 10px}
  .choices{display:flex;flex-wrap:wrap;gap:12px}
  .choices.center{justify-content:center}
  .diffdesc{margin:10px 0 0;color:var(--muted);font-size:21px;max-width:60ch}
  .opt{text-align:left;background:var(--panel);border:3px solid var(--bleu);color:var(--cream);padding:10px 14px;font-size:22px;line-height:1.15;width:100%}
  .opt:hover:not(:disabled){border-color:var(--gold);background:var(--panel2)}
  .opt.right{background:var(--green);border-color:var(--green);color:var(--bg)}
  .opt.wrong{background:var(--red);border-color:var(--red);color:var(--white)}
  .opt.gone{opacity:.25}
  .options{display:grid;gap:10px}
  .options.two{grid-template-columns:1fr 1fr}
  .pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--pixel);font-size:22px;color:var(--gold);text-shadow:3px 3px 0 var(--rouge);pointer-events:none;animation:pop .7s ease forwards;z-index:5;white-space:nowrap}
  .pop.bad{color:var(--red);text-shadow:3px 3px 0 #000}
  .pop.good{color:var(--green);text-shadow:3px 3px 0 #000}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
  .banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--pixel);font-size:16px;color:var(--gold);text-shadow:3px 3px 0 var(--rouge);pointer-events:none;animation:pop 1.1s ease forwards;line-height:2;z-index:6}
  .bubble{position:relative;background:var(--white);color:var(--bg);padding:10px 14px;font-size:22px;line-height:1.15;border:3px solid var(--bg);box-shadow:0 0 0 3px var(--white)}
  .bubble::after{content:"";position:absolute;left:-14px;top:18px;width:10px;height:10px;background:var(--white);box-shadow:-6px 6px 0 -2px var(--white)}
  .qbar{background:var(--panel);border:3px solid var(--panel2);padding:10px 14px;margin:0 0 12px;font-size:23px;line-height:1.15}
  .qbar b{display:block;font-family:var(--pixel);font-size:8px;color:var(--mint);font-weight:400;margin-bottom:6px}
  .qbar .blank{color:var(--gold);letter-spacing:.05em}
  .padctl{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .padctl .btn{min-width:64px;touch-action:none;user-select:none}
  .results{text-align:center}
  .results .big{font-family:var(--pixel);font-size:clamp(16px,3.5vw,24px);color:var(--gold);text-shadow:4px 4px 0 var(--rouge);margin:6px 0 16px;line-height:1.5}
  .results .score{font-family:var(--pixel);font-size:12px;color:var(--mint);margin:0 0 18px;line-height:2}
  .results .score b{color:var(--white);font-weight:400}
  .missed{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px;text-align:left}
  .missed li{background:var(--panel);border-left:6px solid var(--rouge);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .missed .cs{color:var(--mint);font-family:var(--pixel);font-size:9px;margin-top:4px}
  .coach{display:flex;gap:18px;align-items:center;text-align:left;margin:0 auto 20px;max-width:640px}
  .coach .bubble{flex:1 1 auto}
  .coach .who{font-family:var(--pixel);font-size:8px;color:var(--pink);display:block;margin-bottom:6px}

  /* Tétris des mots */
  .tetris{display:grid;grid-template-columns:1fr 150px;gap:14px}
  .tboard{position:relative;background:#0A0714;border:3px solid var(--panel2);height:420px;overflow:hidden;
    background-image:linear-gradient(rgba(247,237,216,.05) 1px,transparent 1px);background-size:100% 42px}
  .theads{display:grid;gap:4px;margin-bottom:6px}
  .thead{font-family:var(--pixel);font-size:8px;color:var(--mint);text-align:center;background:var(--panel);padding:8px 4px;line-height:1.5;border:2px solid var(--panel2)}
  .thead.hint{background:var(--green);color:var(--bg);border-color:var(--green)}
  .tcol{position:absolute;top:0;bottom:0;border-right:1px dashed rgba(247,237,216,.12)}
  .tblock{position:absolute;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;text-align:center;padding:0 4px;overflow:hidden;background:var(--bleu);color:var(--white);border:3px solid #2E55C9;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25);transition:top .12s linear,left .1s ease}
  .tblock.set{background:var(--mint);color:var(--bg);border-color:#3CA898;transition:none}
  .tblock.bad{background:var(--red);border-color:#B33;animation:blink .3s steps(1) 3}
  .tblock.clear{background:var(--gold);border-color:#B8912E;animation:blink .2s steps(1) 3}
  .tside{display:flex;flex-direction:column;gap:10px}
  .tnext{background:var(--panel);border:3px solid var(--panel2);padding:10px;text-align:center}
  .tnext b{display:block;font-family:var(--pixel);font-size:8px;color:var(--mint);font-weight:400;margin-bottom:8px}
  .tnext span{font-size:22px;color:var(--gold)}
  .tctl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tctl .btn{padding:14px 4px 12px;font-size:9px}
  .tctl .wide{grid-column:1 / -1}

  /* Canvas games */
  .cwrap{position:relative;background:#0A0714;border:3px solid var(--panel2);line-height:0;overflow:hidden}
  .cwrap canvas{width:100%;height:auto;display:block;touch-action:none}
  .cwrap .banner{line-height:2}

  /* Frogger */
  .fwrap{position:relative;width:100%;overflow:hidden;border:3px solid var(--panel2)}
  .fboard{position:relative;width:480px;height:360px;transform-origin:0 0;background:#0A0714}
  .flane{position:absolute;left:0;right:0;height:40px}
  .flane.road{background:#2B2B3A;background-image:linear-gradient(90deg,rgba(247,237,216,.35) 0 24px,transparent 24px 48px);background-size:48px 4px;background-repeat:repeat-x;background-position:0 18px}
  .flane.river{background:#1F4FA8;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 20px,transparent 20px 40px)}
  .flane.safe{background:#5B4A2E;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.15) 0 40px,transparent 40px 80px)}
  .flane.doors{background:#14361F}
  .fobj{position:absolute;top:0;left:0;will-change:transform}
  .fdoor{position:absolute;top:2px;height:36px;width:100px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:3px solid var(--gold);color:var(--cream);font-size:16px;line-height:1;text-align:center;padding:0 4px;overflow:hidden}
  .fdoor.right{background:var(--green);border-color:var(--green);color:var(--bg)}
  .fdoor.wrong{background:var(--red);border-color:var(--red)}
  .frog{position:absolute;left:0;top:0;will-change:transform;z-index:3;transition:transform .08s linear}
  .frog.dead{animation:blink .2s steps(1) 4}
  .padctl.cross{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}

  /* Mode rétro : trait tremblé, papier, grain, vignette (comme un vieux dessin animé) */
  .townwrap.painted{background:#e6d3ac;border-color:#6b4a2a;box-shadow:0 0 0 4px var(--bg),0 0 0 8px #3d2a18,0 12px 0 8px #000}
  .townwrap.painted::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' seed='23'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='table' tableValues='0 0.15 0.95 1'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23g)'/%3E%3C/svg%3E"),radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(8,5,3,.8) 100%);background-size:240px 240px,100% 100%;mix-blend-mode:multiply;opacity:1;z-index:3;animation:grain .28s steps(6) infinite}
  .townwrap.painted::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background-image:linear-gradient(90deg,transparent 0 31%,rgba(255,250,240,.28) 31%,transparent calc(31% + 1px)),linear-gradient(90deg,transparent 0 68%,rgba(20,12,8,.35) 68%,transparent calc(68% + 1px)),linear-gradient(90deg,transparent 0 12%,rgba(255,250,240,.18) 12%,transparent calc(12% + 1px));background-size:100% 100%;animation:scratch 1.7s steps(9) infinite;mix-blend-mode:screen}
  @keyframes scratch{0%{background-position:0 0,0 0,0 0;opacity:.9}20%{background-position:14px 0,-30px 0,40px 0;opacity:.3}40%{background-position:-60px 0,22px 0,-10px 0;opacity:.8}60%{background-position:90px 0,-8px 0,130px 0;opacity:.2}80%{background-position:-20px 0,60px 0,-80px 0;opacity:.7}100%{background-position:0 0,0 0,0 0;opacity:.5}}
  @keyframes flicker{0%,100%{opacity:1}8%{opacity:.93}10%{opacity:1}31%{opacity:.96}52%{opacity:1}53%{opacity:.9}55%{opacity:1}77%{opacity:.95}}
  @keyframes grain{0%{background-position:0 0,0 0}33%{background-position:-40px 30px,0 0}66%{background-position:50px -20px,0 0}100%{background-position:0 0,0 0}}
  .townwrap.painted .banner,.townwrap.painted .pop{z-index:4}

  /* La place du Bistrot */
  .town{display:flex;flex-direction:column;gap:12px}
  .townhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .townhead h1{margin:0}
  .townwrap{max-width:900px;width:100%;margin:0 auto;border-color:var(--mint);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2),0 12px 0 8px #000}
  .townbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:3px solid var(--panel2);padding:10px 14px;font-size:22px;line-height:1.15;text-align:center;min-height:56px;max-width:900px;width:100%;margin:0 auto}
  .townpad{margin-top:4px}
  @media (min-width:900px){.townpad{display:none}}

  /* Accueil et records */
  .welcome{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 40px}
  .wcard{display:flex;gap:26px;align-items:flex-start;background:var(--panel);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2),0 14px 0 8px #000;padding:26px 28px;max-width:860px;width:100%;cursor:pointer}
  .wcard .px{flex:0 0 auto}
  .wbody{flex:1 1 auto;min-width:0}
  .wbody .dtext{font-size:27px;min-height:96px}
  .wgame{display:flex;align-items:center;gap:14px;background:var(--bg);border:3px solid var(--panel2);padding:10px 14px;margin:12px 0 0}
  .wgame b{font-family:var(--pixel);font-size:10px;color:var(--gold);font-weight:400;line-height:1.6}
  .nameform{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .nameinput{font:inherit;font-size:26px;padding:8px 12px;background:var(--bg);color:var(--cream);border:3px solid var(--mint);min-width:200px;flex:1 1 200px}
  .nameinput:focus{outline:4px solid var(--gold)}
  .nameinput.shake{animation:shake .35s ease}
  .wskip{margin-top:18px;min-height:40px}
  .wdots{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .wdots span{width:10px;height:10px;background:var(--panel2)}
  .wdots span.on{background:var(--gold)}
  .who{font-family:var(--pixel);font-size:9px;color:var(--mint);line-height:1.6;align-self:center}
  .rname{font-family:var(--pixel);font-size:9px;color:var(--mint);margin:-8px 0 14px}
  .rplayer{font-family:var(--pixel);font-size:10px;color:var(--mint);margin:0 0 20px;line-height:2}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px}
  .rcard{background:var(--panel);border:3px solid var(--panel2);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
  .rcard .px{margin-bottom:4px}
  .rcard .rtitle{font-family:var(--pixel);font-size:9px;color:var(--gold);line-height:1.6}
  .rcard .rscore{font-family:var(--pixel);font-size:18px;color:var(--cream)}
  .rcard .rmeta{color:var(--muted);font-size:19px;min-height:22px}
  .rcard.empty .rscore{color:var(--muted)}
  .rcard.top{border-color:var(--gold)}

  .carousel{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
  .carstage{display:flex;align-items:flex-end;justify-content:center;gap:26px;min-height:132px;flex:0 1 380px;touch-action:pan-y;user-select:none;cursor:grab;background:var(--bg);border:3px solid var(--panel2);padding:12px 10px}
  .carstage .side{opacity:.3}
  .carstage .main{position:relative;padding-bottom:6px}
  .carstage .main::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:6px;background:rgba(0,0,0,.4);border-radius:50%}
  .cardots{justify-content:center;margin-top:12px}
  .rchar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px}

  /* Le Grand Tri */
  .tri{display:flex;flex-direction:column;gap:12px}
  .belt{position:relative;height:150px;background:#2A2140;border:3px solid var(--panel2);overflow:hidden;background-image:repeating-linear-gradient(90deg,rgba(247,237,216,.07) 0 20px,transparent 20px 40px)}
  .belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#3D3160 0 24px,#2A2140 24px 48px)}
  .plate{position:absolute;top:14px;width:170px;height:104px;border-radius:50%;background:var(--cream);color:var(--bg);border:4px solid #D9C9A8;box-shadow:inset 0 -8px 0 #D9C9A8,0 6px 0 #000;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px;font-size:18px;line-height:1.05;cursor:grab;user-select:none;touch-action:none;overflow:hidden}
  .plate.sel{border-color:var(--gold);box-shadow:inset 0 -8px 0 var(--gold),0 6px 0 #000,0 0 0 4px var(--gold)}
  .plate.drag{cursor:grabbing;z-index:5}
  .plate.ok{background:var(--green);border-color:var(--green);box-shadow:inset 0 -8px 0 #3CA83C,0 6px 0 #000}
  .plate.bad{background:var(--red);border-color:var(--red);color:var(--white);box-shadow:inset 0 -8px 0 #B33,0 6px 0 #000}
  .bins{display:grid;gap:10px;grid-template-columns:repeat(var(--n,3),1fr)}
  .bin{background:var(--panel);border:3px solid var(--bleu);padding:14px 8px;font-family:var(--pixel);font-size:9px;line-height:1.6;color:var(--cream);text-align:center;min-height:70px}
  .bin:hover,.bin.over{border-color:var(--gold);background:var(--panel2)}
  .bin.hint{background:var(--green);border-color:var(--green);color:var(--bg)}
  .bin small{display:block;font-family:var(--term);font-size:16px;color:var(--muted);margin-top:4px}

  /* Qui veut gagner des croissants */
  .million{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:start}
  .mq{background:var(--panel);border:4px solid var(--gold);padding:14px 16px;font-size:24px;line-height:1.15;margin-bottom:12px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
  .mopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mopts .opt{border-color:var(--gold);text-align:left}
  .mopts .opt.lock{background:var(--gold);border-color:var(--gold);color:var(--bg);animation:blink .35s steps(1) 3}
  .mopts .opt span.l{font-family:var(--pixel);font-size:9px;color:var(--mint);margin-right:8px}
  .mopts .opt.lock span.l,.mopts .opt.right span.l{color:var(--bg)}
  .ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:3px;background:var(--panel);border:3px solid var(--panel2);padding:8px}
  .ladder li{display:flex;justify-content:space-between;font-family:var(--pixel);font-size:8px;padding:6px 8px;color:var(--muted);line-height:1.4}
  .ladder li.safe{color:var(--cream)}
  .ladder li.cur{background:var(--gold);color:var(--bg)}
  .ladder li.done{color:var(--mint)}
  .lifelines{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .lifelines .btn:disabled{opacity:.35}
  .mhint{background:var(--panel);border-left:6px solid var(--mint);padding:8px 12px;margin:0 0 12px;font-size:21px}
  .public{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px;align-items:end;height:90px}
  .public div{background:var(--mint);position:relative;text-align:center;font-family:var(--pixel);font-size:8px;color:var(--bg);padding-top:4px}
  .public div::after{content:attr(data-l);position:absolute;top:100%;left:0;right:0;color:var(--cream);margin-top:4px}
  .mtimer{height:12px;background:var(--bg);border:2px solid var(--panel2);margin:0 0 12px}
  .mtimer div{height:100%;background:var(--gold);transition:width .1s linear}

  /* Chasse aux fautes */
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .hole{position:relative;height:190px;background:linear-gradient(transparent 55%,#3A2A1A 55%,#3A2A1A 100%);border:3px solid var(--panel2);overflow:hidden;cursor:pointer}
  .hole::after{content:"";position:absolute;left:12%;right:12%;bottom:56px;height:22px;background:#120C08;border-radius:50%;box-shadow:inset 0 6px 0 #000}
  .mole{position:absolute;left:50%;bottom:44px;transform:translate(-50%,120px);transition:transform .25s cubic-bezier(.3,1.4,.5,1);z-index:2}
  .mole.up{transform:translate(-50%,0)}
  .mole.bonk{transform:translate(-50%,10px) rotate(-20deg);filter:brightness(1.6)}
  .mbubble{position:absolute;left:8px;right:8px;top:8px;background:var(--white);color:var(--bg);border:3px solid var(--bg);padding:6px 8px;font-size:18px;line-height:1.05;text-align:center;opacity:0;transition:opacity .2s;z-index:3;box-shadow:0 0 0 3px var(--white)}
  .mbubble.show{opacity:1}
  .mbubble.ok{background:var(--green);box-shadow:0 0 0 3px var(--green)}
  .mbubble.oops{background:var(--red);color:var(--white);box-shadow:0 0 0 3px var(--red)}
  .whack-timer{height:12px;background:var(--panel);border:2px solid var(--panel2);margin:0 0 14px}
  .whack-timer div{height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#3CA83C 8px 12px);transition:width 1s linear}
  .whack-timer div.hurry{background:repeating-linear-gradient(90deg,var(--red) 0 8px,#B33 8px 12px)}

  /* Boss */
  .battle{position:relative;height:270px;background:linear-gradient(#170f2a,#2b1a4a 70%,#3a2560 70%,#1e1438);border:3px solid var(--panel2);overflow:hidden;margin-bottom:14px;transition:background .4s}
  .battle.danger{background:linear-gradient(#2a0b18,#3a1024 70%,#4a1a2a 70%,#2a0b18)}
  .battle .floor{position:absolute;left:0;right:0;bottom:0;height:30%;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px)}
  .fighter{position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .fighter.hero-side{left:8%}
  .fighter.boss-side{right:8%}
  .fighter .label{font-family:var(--pixel);font-size:9px;color:var(--mint);line-height:1.6;text-align:center}
  .fighter .label.boss{color:var(--pink)}
  .hp{height:16px;width:180px;background:var(--panel);border:3px solid var(--panel2);display:flex;gap:3px;padding:2px}
  .hp span{flex:1;background:var(--pink)}
  .hp span.gone{background:transparent}
  .sprite-wrap{position:relative}
  .boss-sprite{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .boss-sprite.hit{animation:bosshit .45s steps(3)}
  @keyframes bosshit{0%{transform:translateX(26px);filter:invert(1) brightness(2)}100%{transform:translateX(0)}}
  .boss-sprite.attack{animation:bosslunge .5s ease}
  @keyframes bosslunge{30%{transform:translateX(-70px) scale(1.08)}100%{transform:translateX(0)}}
  .boss-sprite.enraged{animation:rage .25s linear infinite}
  @keyframes rage{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,-3px)}75%{transform:translate(4px,3px)}}
  .hero-sprite.attack{animation:lunge .5s ease}
  @keyframes lunge{35%{transform:translateX(90px)}100%{transform:translateX(0)}}
  .hero-sprite.hurt{animation:hurtflash .5s steps(4)}
  @keyframes hurtflash{0%{filter:brightness(4) sepia(1) hue-rotate(-50deg);transform:translateX(-14px)}100%{transform:translateX(0)}}
  .slash{position:absolute;pointer-events:none;animation:slashout .3s ease forwards}
  @keyframes slashout{0%{transform:scale(.6) rotate(-20deg);opacity:1}100%{transform:scale(1.4) rotate(10deg);opacity:0}}
  .proj{position:absolute;left:0;top:0;pointer-events:none;transition:transform .38s cubic-bezier(.4,0,.8,1)}
  .taunt{position:absolute;bottom:calc(100% + 12px);right:0;min-width:180px;max-width:260px;font-size:20px;padding:8px 12px}
  .taunt::after{left:auto;right:24px;top:100%;box-shadow:6px -6px 0 -2px var(--white)}
  .cmdbox{background:var(--panel);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--panel2);padding:14px 16px}
  .qtimer{height:12px;background:var(--bg);border:2px solid var(--panel2);margin:0 0 12px}
  .qtimer div{height:100%;background:var(--gold);transition:width .1s linear}
  .qtext{font-size:24px;margin:0 0 12px;line-height:1.15}
  .bosspick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .bosscard{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--panel2);padding:16px 12px;text-align:center}
  .bosscard:hover,.bosscard:focus-visible{border-color:var(--pink)}
  .bosscard .name{font-family:var(--pixel);font-size:9px;color:var(--gold);line-height:1.6}
  .bosscard .intro{font-size:20px;color:var(--muted);line-height:1.1}

  .foot{margin-top:40px;color:var(--muted);font-size:19px;max-width:72ch}
  .foot p{margin:0}
  #confetti{position:fixed;inset:0;pointer-events:none;display:none;z-index:45}

  @media (max-width:640px){
    body{font-size:20px}
    .page{padding:0 12px 40px}
    .screen{padding:14px 12px}
    .tetris{grid-template-columns:1fr}
    .tside{flex-direction:row;flex-wrap:wrap}
    .tnext{flex:1 1 100%}
    .tctl{flex:1 1 100%;grid-template-columns:repeat(4,1fr)}
    .tctl .wide{grid-column:auto}
    .tboard{height:360px}
    .tblock{font-size:15px}
    .million{grid-template-columns:1fr}
    .plate{width:140px;height:92px;font-size:16px;padding:8px 12px}
    .bins{grid-template-columns:repeat(2,1fr)}
    .bin{font-size:8px}
    .ladder{flex-direction:row;flex-wrap:wrap;gap:4px}
    .ladder li{padding:4px 6px}
    .holes{grid-template-columns:repeat(2,1fr)}
    .hole{height:170px}
    .mopts{grid-template-columns:1fr}
    .battle{height:230px}
    .fighter.hero-side{left:3%}
    .fighter.boss-side{right:3%}
    .hp{width:120px}
    .taunt{max-width:170px;font-size:17px}
    .options.two{grid-template-columns:1fr}
    .coach{flex-direction:column;text-align:center}
    .coach .bubble::after{display:none}
    .dialog{flex-direction:column;align-items:center;text-align:center}
    .wcard{flex-direction:column;align-items:center;text-align:center;padding:18px 14px}
    .wbody .dtext{font-size:23px}
    .nameform{justify-content:center}
  }

  :focus-visible{outline:3px solid var(--brick);outline-offset:3px}

  .btn.blue{background:#6FBFAE} .btn.blue:hover{background:#8FD4C4}

  .btn.ghost{background:var(--paper2);color:var(--ink)} .btn.ghost:hover{background:#FFF8EC}
  .btn.ghost.sel{background:var(--brick);color:#FFF8EC;box-shadow:3px 3px 0 var(--ink)}
  .btn.small{font-size:12px;padding:8px 12px 6px} .btn.big{font-size:18px;padding:14px 26px 12px}
  .btn:disabled{opacity:.45}
  .blink{animation:blink 1s steps(1) infinite}
  .top{margin-bottom:22px} .logo-text{font-family:var(--pixel);font-size:26px;color:var(--ink);text-shadow:2px 2px 0 var(--mustard)} .logo-sub{color:#7A6650;font-size:15px;font-style:italic}
  .who{font-family:var(--pixel);font-size:13px;color:var(--teal)}
  h1{font-family:var(--pixel);font-size:clamp(26px,5vw,40px);color:var(--ink);text-shadow:3px 3px 0 var(--mustard)}
  .press{font-family:var(--pixel);font-size:14px;color:var(--brick)}
  .title h1{font-size:clamp(36px,8vw,74px);color:var(--ink);text-shadow:5px 5px 0 var(--mustard),10px 10px 0 rgba(43,26,16,.2)}

  .grid{gap:20px}
  .cart{background:var(--paper3);border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease}
  .cart:hover,.cart:focus-visible{border-color:var(--ink);background:#FFF8EC;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .cart-title{font-family:var(--pixel);font-size:18px;color:var(--brick)} .cart-desc{color:var(--ink);font-size:16px;line-height:1.3} .cart-hi{font-family:var(--pixel);font-size:13px;color:var(--teal)} .cart-badge{font-family:var(--pixel);font-size:12px;color:var(--brick)}
  .dialog,.npcbar,.wcard{background:var(--paper3);border:3px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:4px 4px 0 var(--ink)}
  .dname,.coach .who,.rname{font-family:var(--pixel);font-size:13px;color:var(--brick)}
  .dtext{font-size:19px;line-height:1.35} .wbody .dtext{font-size:21px} .dtext::after{color:var(--brick)} .dtext.done::after{color:var(--teal)}
  .npctext{font-size:18px;line-height:1.3} .npctext b{font-family:var(--pixel);font-size:13px;color:var(--brick)}
  .wgame{background:var(--paper2);border:3px solid var(--ink);border-radius:12px 4px 10px 5px/5px 10px 4px 12px} .wgame b{font-family:var(--pixel);font-size:14px;color:var(--brick)}

  if (charCache[id]) return charCache[id];

  const colors = Object.assign({ E: '#1A1226', X: '#B5563C', M: '#B5563C' }, c.colors);

    if (expr === 'cheer' && i === 6) r = r.slice(0, 4) + 'M' + r.slice(5, 7) + 'M' + r.slice(8);

  });

  ['idle', 'run', 'jump', 'cheer', 'oops', 'fight'].forEach(f => { sp[f] = [...face(f === 'oops' ? 'oops' : f === 'cheer' ? 'cheer' : null), ...BODY_POSES[f === 'oops' ? 'idle' : f]]; });

function px(sp, frame, scale, cls = '') {
  const map = frame ? sp[frame] : sp.map;
  const h = map.length, w = Math.max(...map.map(r => r.length));
  let ink = '', body = '';
  map.forEach((row, y) => {
    let x = 0;
    while (x < w) {
      const ch = row[x], col = sp.colors[ch]; let run = 1;
      while (x + run < w && row[x + run] === ch) run++;
      if (col) { ink += `<rect x="${x}" y="${y}" width="${run}" height="1" rx="0.5" ry="0.5"/>`; body += `<rect x="${x}" y="${y}" width="${run}" height="1" rx="0.5" ry="0.5" fill="${col}"/>`; }
      x += run;
    }
  });
  return `<svg class="px ${cls}" style="--w:${w};--h:${h}${scale ? `;--s:${scale}` : ''}" viewBox="-0.6 -0.6 ${w + 1.2} ${h + 1.2}" aria-hidden="true"><g fill="#2B1A10" stroke="#2B1A10" stroke-width="1.1" stroke-linejoin="round">${ink}</g><g>${body}</g></svg>`;
}

  const svg = px(sp, null, null).replace(/ class="[^"]*"/, '').replace(/ style="[^"]*"/, '');
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

/* ---------- NPC dialogue with typewriter text ---------- */
const Dialog = {
  timer: null, lines: [], i: 0, typing: false, onDone: null,
  show(host, npc, onDone) {
    this.lines = npc.lines; this.i = 0; this.onDone = onDone;
    host.innerHTML = `<div class="dialog" role="dialog" aria-live="polite">${px(SPRITES[npc.sprite], null, 4)}<div class="dbody"><span class="dname">${esc(npc.name.toUpperCase())}</span><p class="dtext" id="dtext"></p><div class="dctl"><button class="btn small" data-action="dnext">Suivant</button><button class="btn ghost small" data-action="dskip">Passer</button></div></div></div>`;
    this.type();
  },
  type() {
    const p = $('#dtext'); if (!p) return;
    const text = this.lines[this.i];
    clearInterval(this.timer);
    p.classList.remove('done');
    const btn = $('[data-action="dnext"]'); if (btn) btn.textContent = this.i === this.lines.length - 1 ? 'Compris' : 'Suivant';
    if (reducedMotion()) { p.textContent = text; p.classList.add('done'); this.typing = false; return; }
    let k = 0; p.textContent = ''; this.typing = true;
    this.timer = setInterval(() => {
      k++; p.textContent = text.slice(0, k);
      if (k % 3 === 0) Sound.tone(900 + (k % 5) * 40, 0.02, 'square', 0.012);
      if (k >= text.length) { clearInterval(this.timer); this.typing = false; p.classList.add('done'); }
    }, 22);
  },
  next() {
    const p = $('#dtext');
    if (this.typing) { clearInterval(this.timer); if (p) { p.textContent = this.lines[this.i]; p.classList.add('done'); } this.typing = false; return; }
    this.i++;
    if (this.i >= this.lines.length) this.finish(); else this.type();
  },
  finish() { clearInterval(this.timer); this.typing = false; const cb = this.onDone; this.onDone = null; if (cb) cb(); },
  stop() { clearInterval(this.timer); this.typing = false; this.onDone = null; }
};
function typeInto(el, text) {
  if (!el) return;
  if (reducedMotion()) { el.textContent = text; return; }
  let k = 0; el.textContent = '';
  const t = setInterval(() => { k++; el.textContent = text.slice(0, k); if (k >= text.length) clearInterval(t); }, 20);
  el.dataset.typing = String(t);
}

const Sound = {
  on: true, ctx: null,
  ensure() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; this.ctx = new AC(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return true; },
  tone(freq, dur, type = 'square', vol = 0.05, when = 0) {
    if (!this.on) return;
    try {
      if (!this.ensure()) return;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      o.connect(g); g.connect(this.ctx.destination);
      const t = this.ctx.currentTime + when;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* audio is optional */ }
  },
  click() { this.tone(520, 0.04, 'square', 0.03); },
  good() { this.tone(660, 0.08); this.tone(880, 0.14, 'square', 0.05, 0.08); },
  bad() { this.tone(170, 0.28, 'sawtooth', 0.045); },
  zap() { this.tone(980, 0.06, 'sawtooth', 0.04); this.tone(320, 0.12, 'sawtooth', 0.04, 0.05); },
  hit() { this.tone(140, 0.12, 'square', 0.06); this.tone(90, 0.2, 'sawtooth', 0.05, 0.05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'square', 0.05, i * 0.12)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, i * 0.18)); },
  splash() { this.tone(240, 0.12, 'sine', 0.05); this.tone(140, 0.25, 'sine', 0.05, 0.1); },
  coin() { this.tone(1320, 0.05, 'square', 0.035); this.tone(1760, 0.1, 'square', 0.035, 0.05); }

  dynamic(ctx, t, town, props, fountain, river, view) {

    ctx.restore();
    const f = fountain;
    if (inView(f.x, f.y)) {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) { const ph = (t * 1.6 + i * 0.3) % 1, ang = -Math.PI / 2 + (i - 3) * 0.28; const sx = f.x + Math.cos(ang) * 8, sy = f.y - 40; const ex = f.x + Math.cos(ang) * (16 + ph * 26), ey = sy - 6 + ph * ph * 40 - ph * 18; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo((sx + ex) / 2, sy - 14 - (1 - ph) * 8, ex, ey); ctx.stroke(); }
      for (let i = 0; i < 3; i++) { const ph = (t * 0.6 + i * 0.33) % 1; ctx.globalAlpha = 0.5 * (1 - ph); ctx.beginPath(); ctx.ellipse(f.x, f.y, 6 + ph * (f.r - 8), (6 + ph * (f.r - 8)) * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.restore();
    }
    town.forEach(b => {
      const P = b.paint || {}; if (!inView(b.x + b.w / 2, b.y + b.h / 2, 160)) return;

function progressHtml() {
  const d = Progress.load(), lv = Progress.level(), next = Progress.nextXp(), cur = Progress.LEVELS[lv].xp, pct = next ? Math.round((d.xp - cur) / (next - cur) * 100) : 100;
  const m = Progress.mission(), streak = Progress.streak();
  const days = Array.from({ length: 14 }, (_, i) => Progress.dayKey(i - 13));
  const stampsHtml = days.map(k => `<span class="stamp ${d.stamps.includes(k) ? 'on' : ''}" title="${k}">${d.stamps.includes(k) ? '★' : '·'}<small>${k.slice(8)}</small></span>`).join('');
  const topics = Object.keys(Progress.TOPICS).map(t => { const mm = d.mastery[t] || { seen: 0, ok: 0 }, rate = mm.seen ? Math.round(mm.ok / mm.seen * 100) : 0; return `<div class="mrow"><span class="mname">${esc(Progress.TOPICS[t])}${d.badges.includes(t) ? ' <b class="badge">' + esc(Progress.BADGES[t]) + '</b>' : ''}</span><span class="mbar"><i style="width:${mm.seen ? Math.max(4, rate) : 0}%"></i></span><span class="mval">${mm.seen ? rate + ' % sur ' + mm.seen : '—'}</span></div>`; }).join('');
  const troph = ['conj', 'accord', 'pronom', 'texte'].map(k => `<span class="trophy ${d.trophies[k] ? 'on' : ''}">${d.trophies[k] ? '🏆' : '○'} ${esc(BOSSES[k].name)}</span>`).join('');
  const openList = Object.keys(Progress.UNLOCK).filter(id => id !== 'records').map(id => `<span class="unlock ${Progress.isOpen(id) ? 'on' : ''}">${esc(GAME_INFO[id].title)} ${Progress.isOpen(id) ? '· ouvert' : '· ' + Progress.UNLOCK[id] + ' ★'}</span>`).join('');
  return `<div class="prog">
    <div class="pblock"><span class="rtitle">Niveau ${lv + 1} · ${esc(Progress.levelTitle())}</span><span class="xpbar"><i style="width:${pct}%"></i></span><span class="rmeta">${d.xp} XP${next ? ` · prochain niveau à ${next}` : ' · niveau maximum'} · ${Progress.totalStars()} ★ · ${d.croissants} croissants</span><div class="unlocks">${openList}</div></div>
    <div class="pblock"><span class="rtitle">Passeport du Bistrot</span><span class="rmeta">Mission du jour : ${esc(Progress.missionText(m))} ${m.done ? '— accomplie' : '— à faire'} · série : ${streak} jour${streak > 1 ? 's' : ''}</span><div class="stamps">${stampsHtml}</div></div>
    <div class="pblock"><span class="rtitle">Carnet de maîtrise</span>${topics}</div>
    <div class="pblock"><span class="rtitle">Trophées</span><div class="trophies">${troph}${Progress.allTrophies() ? '<span class="trophy on">🥇 Champion : la statue d\'or est sur la place</span>' : ''}</div></div>
  </div>`;
}
/* a title card before the round, like a film intertitle */
function showIntroCard(id, then) {
  const g = GAME_INFO[id], place = (typeof shortName !== 'undefined' && shortName[id]) || '';
  const el = document.createElement('div'); el.className = 'intro'; el.innerHTML = `<div class="icard"><div class="ikicker">${esc(place)}</div><div class="ititle">${esc(g ? g.title : id)}</div><div class="isub">${esc(typeof DIFF[diff] === 'string' ? DIFF[diff] : (DIFF[diff] && DIFF[diff].label) || '')}</div><div class="pfoot"><span>© 1930, BISTROT ARCADE, ${esc(g ? g.title : id)}</span><span class="pprint">IMPRIMÉ À PARIS</span></div></div>`;
  document.body.appendChild(el);
  let done = false; const finish = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), 260); then(); };
  el.addEventListener('click', finish); setTimeout(finish, 1700);
}
/* ---------- full screen : the game card is scaled to fit the window ---------- */
function fitGame() {
  const g = $('#app > .game, #app > .records, #app > .list, #app > .welcome, #app > .title');
  if (!g) return;
  g.style.transform = 'none';
  const W = 1040, natural = Math.max(g.scrollHeight, g.offsetHeight, 400);
  const sc = Math.min(window.innerWidth / (W + 24), window.innerHeight / (natural + 16), 1.6);
  g.style.setProperty('--gs', sc);
  g.style.transform = `translate(-50%, 0) scale(${sc})`;
}
window.addEventListener('resize', fitGame);
new MutationObserver(() => { clearTimeout(fitGame._t); fitGame._t = setTimeout(fitGame, 30); }).observe(app, { childList: true, subtree: true, characterData: true });
/* ---------- pause ---------- */
const Pause = {
  on: false, pendingRAF: [], pendingTO: [], sel: 0,
  items() { return [...document.querySelectorAll('#pmenu .pitem')].filter(b => !b.hidden && b.offsetParent !== null || (!b.hidden && !b.closest('[hidden]'))); },
  open() {
    if (this.on) return; this.on = true; Sound.click();
    const ov = $('#pause'); ov.hidden = false; $('#popts').hidden = true;
    $('#pauseGame').textContent = currentId ? (GAME_INFO[currentId] ? GAME_INFO[currentId].title : 'Jeu') : ($('.town') ? 'La place du Bistrot' : 'Bistrot Arcade');
    this.sel = 0; this.refresh();
  },
  close() { if (!this.on) return; this.on = false; $('#pause').hidden = true; Sound.click(); const raf = this.pendingRAF.splice(0), tos = this.pendingTO.splice(0); raf.forEach(cb => origRAF(cb)); tos.forEach(fn => fn()); },
  toggle() { this.on ? this.close() : this.open(); },
  refresh() {
    $('#pSound').textContent = `Sons : ${Sound.on ? 'oui' : 'non'}`; $('#pMusic').textContent = `Musique : ${Music.on ? 'oui' : 'non'}`;
    $('#pHow').hidden = !currentId; $('#pRetry').hidden = !currentId; $('#pQuit').hidden = !!$('.title'); $('#pQuit').textContent = currentId ? 'Quitter vers la place' : ($('.town') ? 'Liste des jeux' : 'Retour à la place');
    const it = this.items(); it.forEach((b, i) => b.classList.toggle('sel', i === this.sel));
  },
  move(d) { const it = this.items(); if (!it.length) return; this.sel = (this.sel + d + it.length) % it.length; this.refresh(); Sound.click(); },
  act(a) {
    if (a === 'resume') this.close();
    else if (a === 'retry') { const id = currentId, o = lastOpts && lastOpts.id === id ? lastOpts : null; this.close(); if (!id) return; if (o) openGame(id, o); else { clearTimers(); current.setup(); } }
    else if (a === 'options') { $('#popts').hidden = !$('#popts').hidden; this.refresh(); }
    else if (a === 'sound') { Sound.on = !Sound.on; Store.set('sound', Sound.on); if (Sound.on) Sound.click(); this.refresh(); }
    else if (a === 'music') { Music.on = !Music.on; Store.set('music', Music.on); if (Music.on) Music.start(); else Music.stop(); this.refresh(); }
    else if (a === 'records') { this.close(); leaveKeys(current); currentId = null; showRecords(); }
    else if (a === 'char') { this.close(); currentId = null; showWelcome('char', 'home'); }
    else if (a === 'rename') { this.close(); currentId = null; showWelcome('rename', 'home'); }
    else if (a === 'wipe') { if (!window.confirm('Tout effacer : nom, personnage, records et réglages ? Le jeu repart de zéro.')) return; try { Object.keys(localStorage).filter(k => k.startsWith('bistro:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} this.close(); location.reload(); }
    else if (a === 'title') { this.close(); currentId = null; clearTimers(); Dialog.stop(); Town.stop(); if (current && current.leave) current.leave(); leaveKeys(current); current = null; showTitle(); }
    else if (a === 'how') { const id = currentId; this.close(); if (id) replayHowTo(id); }
    else if (a === 'quit') { this.close(); if (currentId || !$('.town')) { currentId = null; showHome(); } else showList(); }
  }
};
const origRAF = window.requestAnimationFrame.bind(window), origST = window.setTimeout.bind(window);
window.requestAnimationFrame = cb => Pause.on ? (Pause.pendingRAF.push(cb), 0) : origRAF(cb);
window.setTimeout = (cb, ms, ...args) => origST(() => { if (Pause.on && typeof cb === 'function') Pause.pendingTO.push(() => cb(...args)); else if (typeof cb === 'function') cb(...args); }, ms);
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if (Town.running && Town.s && Town.s.conv && !Pause.on) return; if ($('.title') && !Pause.on) return; e.preventDefault(); e.stopImmediatePropagation(); Pause.toggle(); return; }
  if (!Pause.on) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'z') Pause.move(-1);
  else if (e.key === 'ArrowDown' || e.key === 's') Pause.move(1);
  else if (e.key === 'Enter' || e.key === ' ') { const it = Pause.items(); const b = it[Pause.sel]; if (b) Pause.act(b.dataset.p); }
}, true);
$('#pauseBtn').addEventListener('click', () => Pause.toggle());
$('#pause').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; Pause.act(b.dataset.p); });
$('#pause').addEventListener('mousemove', e => { const b = e.target.closest('.pitem'); if (!b) return; const it = Pause.items(), i = it.indexOf(b); if (i >= 0 && i !== Pause.sel) { Pause.sel = i; Pause.refresh(); } });
function leaveKeys(g) { if (g && g._key) { window.removeEventListener('keydown', g._key); g._key = null; } if (g && g._keyUp) { window.removeEventListener('keyup', g._keyUp); g._keyUp = null; } }

app.addEventListener('click', e => {
  const dlg = e.target.closest('.dialog');
  const btn = e.target.closest('button');
  if (dlg && (!btn || btn.dataset.action === 'dnext')) { Sound.click(); Dialog.next(); return; }
  if (btn && btn.dataset.action === 'dskip') { Sound.click(); Dialog.finish(); return; }
  if (!btn || btn.disabled) return;
  if (btn.dataset.car) { Welcome.scroll(btn.dataset.car); return; }
  if (btn.dataset.w) { if (btn.dataset.w === 'next') Welcome.next(); else if (btn.dataset.w === 'name') Welcome.submitName(); else if (btn.dataset.w === 'skip') Welcome.skip(); return; }
  if (!btn.dataset.hold) Sound.click();
  if (btn.dataset.action === 'start') return !playerName ? showWelcome('full') : !playerChar ? showWelcome('char') : showHome();
  if (btn.dataset.action === 'options') return Pause.open();
  if (btn.dataset.action === 'records') { leaveKeys(current); return showRecords(); }
  if (btn.dataset.action === 'rename') return showWelcome('rename', $('.records') ? 'records' : 'home');
  if (btn.dataset.action === 'char') return showWelcome('char', $('.records') ? 'records' : 'home');
  if (btn.dataset.action === 'resetscores') { resetScores(); return showRecords(); }
  if (btn.dataset.action === 'home') { const from = current && current.key; leaveKeys(current); return showHome(from); }
  if (btn.dataset.action === 'list') return showList();
  if (btn.dataset.action === 'enter') return Town.interact();
  if (btn.dataset.action === 'talk') return Town.talk();
  if (btn.dataset.action === 'tour') return showWelcome('full');
  if (btn.dataset.game) { leaveKeys(current); return openGame(btn.dataset.game); }
  if (btn.dataset.diff) return setDiff(btn.dataset.diff, current && current.key);
  if (btn.dataset.action === 'howto' && current) return replayHowTo(current.key);
  if (btn.dataset.hold) return;
  if (current) current.onClick(btn);
});
app.addEventListener('mouseover', e => {
  const cart = e.target.closest('.cart');
  const el = $('#npcText');
  if (!cart || !el) return;
  const g = GAME_INFO[cart.dataset.game];
  if (g && el.dataset.typing) { clearInterval(Number(el.dataset.typing)); delete el.dataset.typing; }
  if (g) el.textContent = `${g.title} : ${g.desc}`;
});
window.addEventListener('keydown', e => { if (!current && $('.title') && !Pause.on && !e.metaKey && !e.ctrlKey && !e.altKey) { if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'z') { e.preventDefault(); Title._move(-1); } else if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); Title._move(1); } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const b = Title._sel && Title._sel(); if (b) b.click(); } } });
$('#recordsBtn').addEventListener('click', () => { leaveKeys(current); showRecords(); });


$('#logo').innerHTML = `${px(SPRITES.croissant, null, 2)}<span><span class="logo-text">BISTROT ARCADE</span><span class="logo-sub">Révision Français B</span></span>`;
$('#logo').addEventListener('click', e => { e.preventDefault(); leaveKeys(current); showHome(); });
$('#soundBtn').addEventListener('click', () => { Sound.on = !Sound.on; Store.set('sound', Sound.on); $('#soundBtn').textContent = `Sons : ${Sound.on ? 'oui' : 'non'}`; if (Sound.on) Sound.click(); });
$('#musicBtn').addEventListener('click', () => { Music.on = !Music.on; Store.set('music', Music.on); $('#musicBtn').textContent = `Musique : ${Music.on ? 'oui' : 'non'}`; if (Music.on) Music.start(); else Music.stop(); });
$('#resetBtn').addEventListener('click', () => { resetScores(); if (!current) showRecords(); });
{ const savedDiff = Store.get('diff', 'medium'); if (DIFF[savedDiff]) diff = savedDiff; }
Sound.on = Store.get('sound', true); $('#soundBtn').textContent = `Sons : ${Sound.on ? 'oui' : 'non'}`;
Music.on = Store.get('music', true); $('#musicBtn').textContent = `Musique : ${Music.on ? 'oui' : 'non'}`;
updateWho();
const firstGesture = () => { Music.start(); document.removeEventListener('pointerdown', firstGesture); document.removeEventListener('keydown', firstGesture); };
document.addEventListener('pointerdown', firstGesture);
document.addEventListener('keydown', firstGesture);
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.stop(); else if (Music.on) Music.start(); });

showTitle();
})();
